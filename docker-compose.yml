services:
  laravel_frankenphp:
    container_name: laravel_frankenphp
    image: image_laravel_frankenphp
    build:
      dockerfile: Dockerfile
      context: .
    ports:
      - ${HOST_HTTP_PORT:-80}:${APP_INTERNAL_PORT:-8000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost/up || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
    env_file:
      - .env
      - .env.key
  caddy:
    container_name: caddy
    image: caddy:2-alpine
    depends_on:
      - laravel_frankenphp
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - caddy-data:/data
      - caddy-config:/etc/caddy
      - ./docker/caddy-entrypoint.sh:/scripts/caddy-entrypoint.sh:ro
    restart: unless-stopped
    env_file:
      - .env
      - .env.key
    command: ["/bin/sh","-lc","/scripts/caddy-entrypoint.sh"]
  redis:
    container_name: redis
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
  queue:
    container_name: laravel_queue
    image: image_laravel_frankenphp
    depends_on:
      - laravel_frankenphp
      - redis
    command: php artisan queue:work --tries=3
    restart: unless-stopped
    env_file:
      - .env
      - .env.key
  scheduler:
    container_name: laravel_scheduler
    image: image_laravel_frankenphp
    depends_on:
      - laravel_frankenphp
    command: /bin/sh -lc "while true; do php artisan schedule:run; sleep 60; done"
    restart: unless-stopped
    env_file:
      - .env
      - .env.key

volumes:
  redis-data:
  caddy-data:
  caddy-config:
